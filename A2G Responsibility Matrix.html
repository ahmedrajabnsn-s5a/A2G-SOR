<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>A2G Responsibility Matrix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" id="xlsx-lib"></script>
<style id="page-css">
/* Layout: control-tower board — sticky tab strip, exec summary first, full RASCI grid second */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#121a2b; --muted:#5b6680; --line:#d9dfe8; --soft:#eaeef4;
  --sky:#c8102e; --sky-bg:#fbe7ea; --nok:#1f5fd1; --nok-bg:#e5eefc; --stc:#6b3fa0; --stc-bg:#efe8f7;
  --gn:var(--nok); --gn-bg:var(--nok-bg); --warn:#b26a00; --warn-bg:#fff3dc; --ok:#1d7a4c;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1220; --surface:#151c2e; --ink:#e7ebf3; --muted:#9aa5bd; --line:#2a3550; --soft:#1c2540;
  --sky:#ff5a6e; --sky-bg:#3a1520; --nok:#6aa2ff; --nok-bg:#142a50; --stc:#b38bea; --stc-bg:#2a1d42;
  --warn:#f0b04a; --warn-bg:#3a2a10; --ok:#4fd08c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1220; --surface:#151c2e; --ink:#e7ebf3; --muted:#9aa5bd; --line:#2a3550; --soft:#1c2540;
  --sky:#ff5a6e; --sky-bg:#3a1520; --nok:#6aa2ff; --nok-bg:#142a50; --stc:#b38bea; --stc-bg:#2a1d42;
  --warn:#f0b04a; --warn-bg:#3a2a10; --ok:#4fd08c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 60px}
header h1{font:700 clamp(30px,5vw,46px)/1 var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
header p{color:var(--muted);margin:8px 0 0;max-width:68ch}
.eyebrow{font:600 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;margin:22px 0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{font:600 15px var(--display);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:12px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:2px solid var(--nok);outline-offset:2px}
h2{font:700 24px/1.1 var(--display);margin:0 0 4px;letter-spacing:.01em}
.sub{color:var(--muted);margin:0 0 16px}
section+section{margin-top:36px}
/* party cards */
.parties{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.party{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px}
.party .top{display:flex;justify-content:space-between;align-items:baseline}
.party .name{font:700 22px var(--display)}
.party .big{font:700 40px/1 var(--display);font-variant-numeric:tabular-nums}
.party .big small{font:500 13px var(--body);color:var(--muted);margin-left:4px}
.party .role{color:var(--muted);font-size:14px;margin:0}
.party ul{margin:0;padding-left:18px;font-size:14px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.s-sky{background:var(--sky)}.s-nok{background:var(--nok)}.s-stc{background:var(--stc)}.s-gn{background:var(--nok)}
.L.R.gn{background:var(--nok);color:#fff}.L.S.gn{background:var(--nok-bg);color:var(--nok)}
/* phase lanes */
.lanes{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px}
.lane{display:grid;grid-template-columns:minmax(150px,230px) 1fr 70px;gap:12px;align-items:center}
.lane .lbl{font-weight:600;font-size:14px}
.lane .lbl span{display:block;color:var(--muted);font:400 12px var(--mono)}
.bar{display:flex;height:26px;border-radius:5px;overflow:hidden;background:var(--soft)}
.bar div{display:flex;align-items:center;justify-content:center;color:#fff;font:600 12px var(--mono);min-width:0}
.lane .n{font:600 13px var(--mono);color:var(--muted);text-align:right}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
/* flags */
.flags{display:grid;gap:10px}
.flag{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.flag .sev{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:4px;height:fit-content}
.flag.hi{border-left-color:var(--sky)} .flag.hi .sev{color:var(--sky);background:var(--sky-bg)}
.flag b{display:block}
.flag p{margin:2px 0 0;color:var(--muted);font-size:14px;grid-column:2}
.flag .ref{font:500 12px var(--mono);color:var(--muted);grid-column:2}
/* matrix */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tools input,.tools select{font:15px var(--body);padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)}
.tools input{flex:1 1 220px;min-width:0}
.chip{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font:500 13px var(--mono);color:var(--muted);margin-left:auto}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0}
th.c,td.c{text-align:center;width:78px}
td{padding:9px 12px;border-bottom:1px solid var(--soft);vertical-align:top}
tr.row{cursor:pointer} tr.row:hover td{background:var(--soft)}
tr.grp td{background:var(--soft);font:700 15px var(--display);letter-spacing:.03em;text-transform:uppercase;padding:8px 12px}
td.id{font:500 13px var(--mono);color:var(--muted);width:44px;font-variant-numeric:tabular-nums}
.act{font-weight:500}
.tagp{font:600 11px var(--mono);color:var(--warn);background:var(--warn-bg);padding:2px 6px;border-radius:4px;margin-left:6px;white-space:nowrap}
.L{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;font:700 14px var(--mono)}
.L.R.sky{background:var(--sky);color:#fff}.L.R.nok{background:var(--nok);color:#fff}.L.R.stc{background:var(--stc);color:#fff}
.L.S.sky{background:var(--sky-bg);color:var(--sky)}.L.S.nok{background:var(--nok-bg);color:var(--nok)}.L.S.stc{background:var(--stc-bg);color:var(--stc)}
.L.dash{color:var(--line)}
.rmk{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.detail td{background:var(--soft);font-size:14px;color:var(--ink)}
.detail ul{margin:4px 0;padding-left:18px}
/* penalties & kpi */
.pen{display:grid;gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px}
.pcard h3{margin:0;font:700 19px var(--display)}
.pcard .cap{font:700 26px/1 var(--display);color:var(--sky);text-align:right}
.pcard .cap small{display:block;font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em}
.pcard p{margin:0;color:var(--muted);font-size:14px;grid-column:1/-1}
.pcard .own{grid-column:1/-1;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .t{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font:700 32px/1.1 var(--display);font-variant-numeric:tabular-nums;margin:4px 0}
.kpi .k{font-size:14px}
.kpi .w{font:500 12px var(--mono);color:var(--muted)}
/* how-to */
.steps{display:grid;gap:12px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px 16px 64px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:18px;top:14px;font:700 30px/1 var(--display);color:var(--muted)}
.step h3{margin:0 0 4px;font:700 19px var(--display)}
.step p{margin:0;color:var(--muted);max-width:75ch}
.rasci{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:12px}
.rasci div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px}
.rasci b{font:700 22px var(--mono);display:block}
.btn{font:600 14px var(--body);background:var(--ink);color:var(--bg);border:0;padding:9px 14px;border-radius:7px;cursor:pointer}
footer{margin-top:40px;color:var(--muted);font-size:13px}
@media (max-width:560px){.lane{grid-template-columns:1fr 50px}.lane .lbl{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.bar div{transition:flex-grow .5s ease}}

.pill{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:4px;white-space:nowrap}
.tagm{font:600 11px var(--mono);color:var(--nok);background:var(--nok-bg);padding:2px 6px;border-radius:4px;margin-left:6px;white-space:nowrap}
td.code{font:600 13px var(--mono);color:var(--muted);width:56px}
.links{font:500 12px var(--mono);color:var(--muted)}
.sub-t{width:100%;min-width:0;margin-top:8px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sub-t td{background:var(--surface);padding:6px 10px;font-size:13px;border-bottom:1px solid var(--soft)}
.align{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.align div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.align b{font:700 34px/1 var(--display);display:block;font-variant-numeric:tabular-nums}
.align span{font-size:13px;color:var(--muted)}
.mlink{font:600 12px var(--mono);color:var(--nok);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}

/* edit mode */
.editbar{position:sticky;bottom:0;z-index:6;margin-top:18px;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.editbar .msg{font:500 14px var(--body);margin-right:auto}
.editbar button{font:600 14px var(--body);border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);background:transparent;color:var(--bg);padding:8px 12px;border-radius:7px;cursor:pointer}
.editbar button.primary{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.editbar button:disabled{opacity:.4;cursor:default}
.topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
.tbtn{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:7px;cursor:pointer}
.tbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ro{font-size:13px;color:var(--muted)}
td.act-c{width:76px;white-space:nowrap;text-align:right}
.ib{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:30px;height:30px;border-radius:6px;cursor:pointer;font:600 14px var(--mono)}
.ib:hover{border-color:var(--ink)}
.ib.del:hover{color:var(--sky);border-color:var(--sky)}
body.editing .L{cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}
body.editing .L:hover{box-shadow:inset 0 0 0 2px var(--ink)}
.addrow{margin-top:10px}
.st-txt{font-weight:600}
.st-Aligned{color:var(--ok)} .st-Partial{color:var(--warn)} .st-Conflict,.st-Gap{color:var(--sky)} .st-Added{color:var(--nok)} .st-Not{color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.md{background:var(--surface);color:var(--ink);border-radius:12px;width:min(560px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:12px;box-shadow:0 20px 60px rgb(0 0 0 / .3)}
.md h3{margin:0;font:700 22px var(--display)}
.md label{display:grid;gap:4px;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.md input,.md select,.md textarea{font:15px var(--body);padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);text-transform:none;letter-spacing:0;width:100%}
.md textarea{min-height:70px;resize:vertical}
.md .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.md .hint{font-size:13px;color:var(--muted);background:var(--soft);border-radius:7px;padding:8px 10px}
.md .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.md .danger{color:var(--sky);border-color:var(--sky)}
.md .err{color:var(--sky);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font:500 14px var(--body)}

/* penalty dashboard */
:root{--c1:#c8102e;--c2:#1f5fd1;--c3:#c27a00;--c4:#0f8a7e;--c5:#7a4bc2;--pass:#1d7a4c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#ff5a6e;--c2:#6aa2ff;--c3:#f0b04a;--c4:#3fd0bf;--c5:#b38bea;--pass:#4fd08c}}
:root[data-theme="dark"]{--c1:#ff5a6e;--c2:#6aa2ff;--c3:#f0b04a;--c4:#3fd0bf;--c5:#b38bea;--pass:#4fd08c}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:4px;align-content:start}
.tile .t{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:700 44px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .v small{font:600 18px var(--display);color:var(--muted);margin-left:2px}
.tile .d{font-size:13px;color:var(--muted)}
.tile.alert{border-color:var(--sky);background:linear-gradient(180deg,var(--sky-bg),var(--surface) 70%)}
.tile.alert .v{color:var(--sky)}
.charts{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;margin-top:14px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.chart h3{margin:0;font:700 19px var(--display)}
.chart .cs{margin:2px 0 10px;font-size:13px;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart svg text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart svg .lbl{font-family:var(--body);font-size:12px;fill:var(--ink)}
.chart svg .val{font-family:var(--mono);font-size:12px;font-weight:600;fill:var(--ink)}
.chart svg .grid{stroke:var(--line);stroke-width:1}
.chart svg .capline{stroke:var(--sky);stroke-width:1.5;stroke-dasharray:5 4}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted)}
.lg i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.editbar[hidden]{display:none}
.ptab{width:100%;min-width:720px}
.ptab td{vertical-align:middle}
.ptab .rate{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.ptab .meter{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;width:110px}
.ptab .meter div{height:100%;border-radius:4px}
.ownr{font-weight:600}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:8px}
.kc .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.kc .t{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kc .v{font:700 36px/1 var(--display);font-variant-numeric:tabular-nums}
.kc .n{font-weight:600;font-size:15px}
.kc .w{font:500 12px var(--mono);color:var(--muted)}
@media (max-width:820px){.charts{grid-template-columns:1fr}}

/* KPI dashboard */
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 12px 16px;display:grid;justify-items:center;gap:6px;text-align:center}
.gauge svg{width:100%;max-width:150px;height:auto;overflow:visible}
.gauge .cat{font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.gauge .nm{font-weight:600;font-size:14px;line-height:1.25}
.gauge .bud{font:500 12px var(--mono);color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.gauge .arc{animation:sweep 1.1s cubic-bezier(.2,.7,.2,1) both}@keyframes sweep{from{stroke-dashoffset:var(--len)}}}
.charts3{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.excl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.excl div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.excl b{font:700 18px var(--display);color:var(--muted);min-width:22px}
@media (max-width:560px){.md .two{grid-template-columns:1fr}}
</style>
<template id="shell"><div class="wrap">
<header>
  <div class="eyebrow">Master: A2G POC NTN 2021 SOR · linked to Nokia SoW Ch.3 v24</div>
  <h1>A2G Responsibility Matrix</h1>
  <p>The master SOR split between SKYFive and the GN Operator (Nokia + STC). Each master line opens into the detailed activities behind it.</p>
  <div class="topbar">
    <button class="tbtn" id="editBtn" aria-pressed="false">Edit SOR</button>
    <button class="tbtn" id="xlsBtn">Download Excel</button>
    <span class="ro" id="updated"></span>
  </div>
</header>
<nav role="tablist" id="tabs">
  <button role="tab" data-v="master" aria-selected="true">Master SOR</button>
  <button role="tab" data-v="detail" aria-selected="false">Detail</button>
  <button role="tab" data-v="pen" aria-selected="false">Acceptance KPIs</button>
  <button role="tab" data-v="how" aria-selected="false">How to edit</button>
  <button role="tab" data-v="exec" aria-selected="false">Executive view</button>
</nav>

<div id="v-exec" hidden>
  <section><h2>Who owns what</h2><p class="sub">Master lines each party leads, and how many detailed activities sit behind them.</p><div class="parties" id="parties"></div></section>
  <section><h2>Ownership by master section</h2><p class="sub">Lines led by each party. Shared lines count for both.</p><div class="lanes" id="lanes"></div>
   <div class="legend" style="margin-top:10px"><span><i class="sw s-sky"></i>SKYFive</span><span><i class="sw s-gn"></i>GN Operator (Nokia + STC)</span></div></section>
  <section><h2>Does the detail match the master?</h2><p class="sub">Each master line checked against the detailed activities linked to it.</p><div class="align" id="align"></div></section>
  <section><h2>Decisions to close before sign-off</h2><p class="sub">The master wins. Where the SoW differs, correct the SoW or update the master on purpose.</p><div class="flags" id="flags"></div>
   <button class="tbtn addrow" id="addFlag" hidden>+ Add decision</button></section>
</div>

<div id="v-pen" hidden>
  <section><h2>Acceptance KPIs at a glance</h2><p class="sub">Six A2G KPIs measured at network, node and cluster level from performance and NMS tools, tied to master line E8.</p>
   <div class="tiles" id="ktiles"></div></section>
  <section><h2>Targets</h2><p class="sub">Each ring fills to the target the network must reach. Drop rate is the one KPI where lower is better.</p>
   <div class="gauges" id="kgauges"></div>
   <div class="charts3">
    <div class="chart"><h3>Failure budget</h3><p class="cs">How much failure each KPI tolerates before it misses. Smaller budget = harder to pass.</p><div id="kbud"></div></div>
    <div class="chart"><h3>Target profile</h3><p class="cs">All six targets as success rates (drop rate shown as 90% retained). The closer to the edge, the stricter.</p><div id="kradar"></div></div>
    <div class="chart"><h3>Weight by category</h3><p class="cs">Six KPIs share 100% equally, so accessibility carries half the score.</p><div id="kdonut"></div><div class="lg" id="kdlg"></div></div>
   </div></section>
  <section><h2>What is excluded from measurement</h2><p class="sub">Samples and failures that do not count against the KPIs.</p><div class="excl" id="kexcl"></div></section>
</div>

<div id="v-how" hidden>
  <section><h2>How to edit the SOR</h2><p class="sub">The master sets who owns each line. The detail explains how each line is delivered.</p>
  <div class="steps">
   <div class="step"><h3>Turn on Edit SOR</h3><p>Pencil and bin buttons appear on every row, plus "Add" buttons under each table.</p></div>
   <div class="step"><h3>Quick change: tap an R or S</h3><p>In edit mode, tap any ownership cell to cycle it: R → S → empty. Use this to move an activity from one party to the other in one tap.</p></div>
   <div class="step"><h3>Full edit: tap the pencil</h3><p>Change the name, owners, remarks, master line, phase or alignment. The form shows how many linked activities agree with the master owner.</p></div>
   <div class="step"><h3>Delete safely</h3><p>Deleting a master line asks what to do with its detail activities: move them to another line, or delete them too. Every change can be undone until you save.</p></div>
   <div class="step"><h3>Save changes</h3><p>Nothing is kept until you press Save changes. Saving publishes a new version that everyone with the link sees. Download Excel exports the current version in the same layout as the master workbook.</p></div>
  </div></section>

 dn+=`<text x="${dc}" y="${dc-2}" text-anchor="middle" style="font:700 34px var(--display);fill:var(--ink)">6</text><text x="${dc}" y="${dc+18}" text-anchor="middle">KPIs</text>`;
 $("kdonut").innerHTML=`<svg viewBox="0 0 220 220" role="img" aria-label="Weight by category" style="max-width:240px;margin:0 auto">${dn}</svg>`;
 $("kdlg").innerHTML=cats.map(([c,n])=>`<span><i style="background:var(${KC[c]})"></i>${c} · ${n} KPI${n>1?"s":""}</span>`).join("");
 const EX=["Samples taken below 3,000 m altitude","Samples outside the agreed area-of-interest polygon","Failures not related to the ground network","Backhaul, civil, IP and SAQ issues","KPI degradation from in-plane equipment or receivers","Site MDT periods","Third-party integrations and external systems","External interference, band limits or capex constraints"];
 $("kexcl").innerHTML=EX.map((e,i)=>`<div><b>${i+1}</b><span>${e}</span></div>`).join("")+`<div style="grid-column:1/-1;background:var(--soft)"><span>Monthly KPI values are calculated only for time with 100% site availability.</span></div>`}
// ---------- change tracking
function change(fn,label){hist.push(structuredClone(S));fn();toast(label);renderAll()}
let tt;function toast(t){if(!t)return;let e=document.querySelector(".toast");if(!e){e=document.createElement("div");e.className="toast";e.setAttribute("role","status");document.body.appendChild(e)}e.textContent=t;clearTimeout(tt);tt=setTimeout(()=>e.remove(),2200)}
$("undoBtn").onclick=()=>{if(hist.length){S=hist.pop();toast("Undone");renderAll()}};
$("discardBtn").onclick=()=>confirmBox("Discard all unsaved changes?","Discard",()=>{S=structuredClone(SAVED);hist=[];toast("Changes discarded");renderAll()});
$("editBtn").onclick=()=>{editing=!editing;$("editBtn").setAttribute("aria-pressed",editing);$("editBtn").textContent=editing?"Done editing":"Edit SOR";renderAll()};
const cyc=v=>v==="R"?"S":v==="S"?"":"R";
document.addEventListener("click",e=>{
 const c=e.target.closest("[data-cell]");
 if(c&&editing){e.stopPropagation();const [t,id,k]=c.dataset.cell.split(":");
  const o=t==="m"?mBy(id):S.sow.find(r=>r.id===+id);
  change(()=>{o[k]=cyc(o[k])},`${t==="m"?id:"#"+id} ${k==="sky"?"SKYFive":"GN Operator"} → ${cyc(o[k])||"empty"}`);return}
 const b=e.target.closest("button[data-em],button[data-xm],button[data-ed],button[data-xd],button[data-ef],button[data-xf]");
 if(b){e.stopPropagation();const d=b.dataset;
  if(d.em)editMaster(mBy(d.em));if(d.xm)delMaster(mBy(d.xm));if(d.ed)editDetail(S.sow.find(r=>r.id===+d.ed));if(d.xd)delDetail(S.sow.find(r=>r.id===+d.xd));
  if(d.ef)editFlag(S.flags.find(f=>f.id===+d.ef));if(d.xf){const f=S.flags.find(x=>x.id===+d.xf);confirmBox(`Delete decision "${f.title}"?`,"Delete",()=>change(()=>{S.flags=S.flags.filter(x=>x!==f)},"Decision deleted"))}
  return}
 const mr=e.target.closest("#mtb tr.row");if(mr){mopen=mopen===mr.dataset.c?null:mr.dataset.c;renderM();return}
 const dr=e.target.closest("#tb tr.row");if(dr){const id=+dr.dataset.id;open=open===id?null:id;renderD()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&(e.target.matches("tr.row")||e.target.matches("[data-cell]")))e.target.click();if(e.key==="Escape")closeModal()});
$("mq").addEventListener("input",renderM);$("mst").addEventListener("change",renderM);
$("q").addEventListener("input",renderD);[sel,ml].forEach(x=>x.addEventListener("change",renderD));
document.querySelectorAll(".chip[data-mp]").forEach(b=>b.addEventListener("click",()=>{mparty=mparty===b.dataset.mp?"":b.dataset.mp;document.querySelectorAll(".chip[data-mp]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.mp===mparty));renderM()}));
document.querySelectorAll(".chip[data-p]").forEach(b=>b.addEventListener("click",()=>{party=party===b.dataset.p?"":b.dataset.p;document.querySelectorAll(".chip[data-p]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.p===party));renderD()}));


// ---------- modal helpers
function closeModal(){document.querySelector(".ov")?.remove()}
function modal(title,inner,onOk,okLabel="Save",extra=""){closeModal();
 const ov=document.createElement("div");ov.className="ov";
 ov.innerHTML=`<form class="md" novalidate><h3>${title}</h3>${inner}<div class="err" id="f-err"></div><div class="row">${extra}<button type="button" class="tbtn" id="f-cancel">Cancel</button><button type="submit" class="tbtn" style="background:var(--ink);color:var(--bg);border-color:var(--ink)">${okLabel}</button></div></form>`;
 document.body.appendChild(ov);
 ov.addEventListener("click",e=>{if(e.target===ov)closeModal()});ov.querySelector("#f-cancel").onclick=closeModal;
 ov.querySelector("form").addEventListener("submit",e=>{e.preventDefault();const err=onOk(ov);if(err){ov.querySelector("#f-err").textContent=err}else closeModal()});
 setTimeout(()=>ov.querySelector("input,select,textarea")?.focus(),30);return ov}
function confirmBox(text,ok,fn){modal(text,"",()=>{fn()},ok)}
const opt=(v,cur,l)=>`<option value="${esc(v)}" ${v===cur?"selected":""}>${esc(l??v)}</option>`;
const rsSel=(id,cur)=>`<select id="${id}">${opt("R",cur,"R · Responsible")}${opt("S",cur,"S · Support")}${opt("",cur,"— · Not involved")}</select>`;
const val=(ov,id)=>ov.querySelector("#"+id).value.trim();

function checkHint(code,sky,gn){const lk=links(code);if(!lk.length)return "No detailed activities are linked to this line yet.";
 const ok=lk.filter(r=>(own(r)==="sky"&&sky==="R")||(own(r)==="gn"&&gn==="R")).length;
 const sug=ok===lk.length?"Aligned":ok===0?"Conflict":"Partial";
 return `${ok} of ${lk.length} linked activities are led by a party that leads this line. Suggested check: <b>${sug}</b>.`}
function editMaster(m){const isNew=!m;m=m||{code:"",sec:secs()[0],name:"",sky:"R",gn:"",note:"",status:"Not in SoW",comment:""};
 const ov=modal(isNew?"Add master line":"Edit master line "+esc(m.code),`
  <div class="two"><label>Code<input id="f-code" value="${esc(m.code)}" placeholder="e.g. GN12"></label>
  <label>Section<select id="f-sec">${secs().map(s=>opt(s,m.sec)).join("")}${opt("__new","","+ New section…")}</select></label></div>
  <label id="f-newsec-l" hidden>New section name<input id="f-newsec"></label>
  <label>Master line<input id="f-name" value="${esc(m.name)}"></label>
  <div class="two"><label>SKYFive${rsSel("f-sky",m.sky)}</label><label>GN Operator${rsSel("f-gn",m.gn)}</label></div>
  <label>Remarks<input id="f-note" value="${esc(m.note)}"></label>
  <div class="hint" id="f-hint">${checkHint(m.code,m.sky,m.gn)}</div>
  <label>Detail check<select id="f-st">${ST.map(s=>opt(s,m.status)).join("")}</select></label>
  <label>Comment<textarea id="f-cm">${esc(m.comment)}</textarea></label>`,ov=>{
  const code=val(ov,"f-code"),name=val(ov,"f-name");if(!code||!name)return "Code and master line are required.";
  if(S.master.some(x=>x.code===code&&x!==m))return `Code ${code} is already used.`;
  let sec=val(ov,"f-sec");if(sec==="__new"){sec=val(ov,"f-newsec");if(!sec)return "Enter a name for the new section."}
  change(()=>{const t=isNew?{}:mBy(m.code);const old=m.code;
   Object.assign(t,{code,sec,name,sky:val(ov,"f-sky"),gn:val(ov,"f-gn"),note:val(ov,"f-note"),status:val(ov,"f-st"),comment:val(ov,"f-cm")});
   if(isNew){const i=S.master.map(x=>x.sec).lastIndexOf(sec);S.master.splice(i<0?S.master.length:i+1,0,t)}
   else if(old!==code)S.sow.forEach(r=>{if(r.mc===old)r.mc=code});
   if(!isNew&&t.sec!==m.sec){S.master.splice(S.master.indexOf(t),1);const i=S.master.map(x=>x.sec).lastIndexOf(sec);S.master.splice(i<0?S.master.length:i+1,0,t)}
  },isNew?`Added ${code}`:`Updated ${code}`)});
 const upd=()=>{ov.querySelector("#f-hint").innerHTML=checkHint(m.code,val(ov,"f-sky"),val(ov,"f-gn"))};
 ov.querySelector("#f-sky").onchange=upd;ov.querySelector("#f-gn").onchange=upd;
 ov.querySelector("#f-sec").onchange=e=>{ov.querySelector("#f-newsec-l").hidden=e.target.value!=="__new"}}
function delMaster(m){const lk=links(m.code);
 const others=S.master.filter(x=>x!==m);
 modal(`Delete ${esc(m.code)} · ${esc(m.name)}?`,lk.length?`<div class="hint">${lk.length} detailed activit${lk.length>1?"ies are":"y is"} linked to this line.</div>
  <label>What happens to them<select id="f-act"><option value="move">Move them to another master line</option><option value="del">Delete them too</option><option value="keep">Keep them, unlinked</option></select></label>
  <label id="f-to-l">Move to<select id="f-to">${others.map(x=>opt(x.code,"",x.code+" · "+x.name)).join("")}</select></label>`:`<div class="hint">No detailed activities are linked. You can undo this until you save.</div>`,ov=>{
  const a=lk.length?val(ov,"f-act"):"",to=lk.length?val(ov,"f-to"):"";
  change(()=>{S.master=S.master.filter(x=>x.code!==m.code);
   if(a==="move")S.sow.forEach(r=>{if(r.mc===m.code)r.mc=to});
   if(a==="del")S.sow=S.sow.filter(r=>r.mc!==m.code);
   if(a==="keep")S.sow.forEach(r=>{if(r.mc===m.code)r.mc=""})},`Deleted ${m.code}`)},"Delete");
 const a=document.querySelector("#f-act");if(a)a.onchange=()=>{document.querySelector("#f-to-l").hidden=a.value!=="move"}}
function editDetail(r){const isNew=!r;const nid=Math.max(0,...S.sow.map(x=>x.id))+1;
 r=r||{id:nid,ph:"P",act:"",sky:"R",gn:"",rmk:"",pen:"",src:"master",mc:ml.value||S.master[0]?.code||""};
 modal(isNew?`Add detail activity #${nid}`:`Edit activity #${r.id}`,`
  <label>Activity<input id="f-act" value="${esc(r.act)}"></label>
  <div class="two"><label>SKYFive${rsSel("f-sky",r.sky)}</label><label>GN Operator${rsSel("f-gn",r.gn)}</label></div>
  <div class="two"><label>Master line<select id="f-mc">${opt("",r.mc,"— Not linked")}${S.master.map(m=>opt(m.code,r.mc,m.code+" · "+m.name)).join("")}</select></label>
  <label>Phase<select id="f-ph">${Object.entries(PH).map(([k,v])=>opt(k,r.ph,v)).join("")}</select></label></div>
  <label>Remark<textarea id="f-rmk">${esc(r.rmk)}</textarea></label>
  <div class="two"><label>Source<select id="f-src">${opt("sow",r.src,"Nokia SoW")}${opt("master",r.src,"Master SOR")}</select></label></div>`,ov=>{
  const act=val(ov,"f-act");if(!act)return "Enter the activity name.";
  const sky=val(ov,"f-sky"),gn=val(ov,"f-gn");if(sky!=="R"&&gn!=="R")return "Give one party R, so every activity has an owner.";
  if(sky==="R"&&gn==="R")return "Only one party can be R. Set the other to S.";
  change(()=>{const t=isNew?{id:nid}:S.sow.find(x=>x.id===r.id);
   Object.assign(t,{act,sky,gn,mc:val(ov,"f-mc"),ph:val(ov,"f-ph"),rmk:val(ov,"f-rmk"),src:val(ov,"f-src")});
   if(isNew)S.sow.push(t)},isNew?`Added #${nid}`:`Updated #${r.id}`)})}
function delDetail(r){confirmBox(`Delete activity #${r.id} · ${esc(r.act)}?`,"Delete",()=>change(()=>{S.sow=S.sow.filter(x=>x.id!==r.id)},`Deleted #${r.id}`))}
function editFlag(f){const isNew=!f;f=f||{id:Math.max(0,...S.flags.map(x=>x.id))+1,sev:"clarify",title:"",text:"",ref:""};
 modal(isNew?"Add decision":"Edit decision",`<label>Title<input id="f-t" value="${esc(f.title)}"></label>
  <label>Detail<textarea id="f-x">${esc(f.text)}</textarea></label>
  <div class="two"><label>Priority<select id="f-s">${opt("high",f.sev,"High")}${opt("clarify",f.sev,"Clarify")}</select></label><label>Reference<input id="f-r" value="${esc(f.ref)}" placeholder="e.g. GN3 · #5"></label></div>`,ov=>{
  const title=val(ov,"f-t");if(!title)return "Enter a title.";
  change(()=>{const t=isNew?{id:f.id}:S.flags.find(x=>x.id===f.id);Object.assign(t,{title,text:val(ov,"f-x"),sev:val(ov,"f-s"),ref:val(ov,"f-r")});if(isNew)S.flags.push(t)},isNew?"Decision added":"Decision updated")})}
$("addM").onclick=()=>editMaster(null);$("addD").onclick=()=>editDetail(null);$("addFlag").onclick=()=>editFlag(null);

// ---------- save (republish this page)
const RESET=":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}";
const SC="script",TP="template";
function buildDoc(state){
 const json=JSON.stringify(state).replace(/</g,"\\u003c");
 return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${RESET}</style></head><body>`+
 `<title>A2G Responsibility Matrix</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n`+
 `<link rel="stylesheet" href="${document.querySelector('link[rel=stylesheet]').href}">\n`+
 `<${SC} src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" id="xlsx-lib"></${SC}>\n`+
 `<style id="page-css">${$("page-css").textContent}</style>\n`+
 `<${TP} id="shell">${$("shell").innerHTML}</${TP}>\n<div id="app"></div>\n`+
 `<${SC} type="application/json" id="sor-data">${json}</${SC}>\n`+
 `<${SC} id="main">${$("main").textContent}</${SC}>\n</body></html>`}
$("saveBtn").onclick=async()=>{const btn=$("saveBtn");btn.disabled=true;$("emsg").textContent="Saving…";
 const d=new Date(),st={...S,updated:d.toISOString().slice(0,10)+" "+d.toTimeString().slice(0,5)};
 const a=await claude.use("artifact");
 if(!a){$("emsg").textContent="Saving is not available in this view. Download Excel to keep your changes.";btn.disabled=false;return}
 try{sessionStorage.setItem("sor-draft",JSON.stringify({base:SAVED.updated,state:S}))}catch(e){}
 try{await a.publish(buildDoc(st));try{sessionStorage.removeItem("sor-draft")}catch(e){}}
 catch(err){const c=err&&err.code;
  if(c==="conflict"){$("emsg").textContent="Someone saved a newer version. Reloading it now; your changes are kept to re-apply."}
  else if(c==="not_writer"||c==="not_granted"){ro=true;try{sessionStorage.removeItem("sor-draft")}catch(e){};renderAll()}
  else{$("emsg").textContent="Save failed. Try again in a moment.";btn.disabled=false}}};

// ---------- Excel export
$("xlsBtn").onclick=async()=>{
 if(!window.XLSX){toast("Excel export is still loading. Try again.");return}
 const rs=v=>v==="R"?"x":v==="S"?"Supports":"";
 const a1=[["","SkyFive","GN Operator","Remarks","Code","Linked detail items","Alignment with SoW","Comment"]];
 let last="";S.master.forEach(m=>{if(m.sec!==last){if(last)a1.push([]);a1.push([m.sec]);last=m.sec}
  a1.push([m.name,rs(m.sky),rs(m.gn),m.note,m.code,links(m.code).map(r=>"#"+r.id).join(", ")||"—",m.status,m.comment])});
 const a2=[["#","Phase","Activity","SKYFive","GN Operator","Master code","Master line","Remark","Source"]].concat(
  S.sow.map(r=>[r.id,PH[r.ph]||r.ph,r.act,r.sky,r.gn,r.mc,mBy(r.mc)?.name||"",r.rmk,r.src==="master"?"Added from master SOR":"Nokia SoW Ch.3"]));
 const a3=[["Decision","Priority","Detail","Reference"]].concat(S.flags.map(f=>[f.title,f.sev==="high"?"High":"Clarify",f.text,f.ref]));
 const wb=XLSX.utils.book_new();
 [[a1,"SOR",[50,10,13,40,8,26,18,60]],[a2,"Detail",[5,26,46,10,13,10,40,60,22]],[a3,"Decisions",[44,10,80,20]]].forEach(([a,n,w])=>{const ws=XLSX.utils.aoa_to_sheet(a);ws["!cols"]=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,n)});
 const buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
 const dl=await claude.use("downloads");
 if(!dl){toast("Download is not available in this view.");return}
 try{await dl.save({filename:"A2G-SOR-GN-Operator.xlsx",data:new Uint8Array(buf)})}catch(e){if(e&&e.code!=="declined")toast("Download did not complete.")}};

// ---------- tabs
const views=["master","detail","pen","how","exec"];
function show(v){if(!views.includes(v))v="master";views.forEach(x=>$("v-"+x).hidden=x!==v);document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v))}
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){location.hash=b.dataset.v;show(b.dataset.v)}});
addEventListener("hashchange",()=>show(location.hash.slice(1)));show(location.hash.slice(1));
if(S!==SAVED&&JSON.stringify(S)!==JSON.stringify(SAVED)){hist=[structuredClone(SAVED)];editing=true;$("editBtn").setAttribute("aria-pressed","true");$("editBtn").textContent="Done editing"}
renderAll();
})();
</script>
